micronaut.application.name=fix-slide-pic
micronaut.server.max-request-size=200MB
micronaut.server.multipart.max-file-size=25MB
micronaut.server.read-idle-timeout=5m
micronaut.server.write-idle-timeout=5m
micronaut.server.idle-timeout=5m

micronaut.router.static-resources.default.enabled=true
micronaut.router.static-resources.default.paths=classpath:public
micronaut.router.static-resources.default.mapping=/**

slide-fixer.image-model=gemini-nano-banana-2.1
slide-fixer.judge-model=gemini-3.8-flash
slide-fixer.max-iterations=3
slide-fixer.test-pictures-dir=test-pictures
slide-fixer.output-dir=build/generated-slides
